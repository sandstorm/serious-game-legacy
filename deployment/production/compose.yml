##################################################
##### PRODUCTION ENVIRONMENT            ##########
# this file is deployed on the prod server to /home/deploy/[project-name]/
# (so all paths are relative to this folder)
##################################################

services:

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy_files:/etc/caddy
      - ./caddy_data:/data
      - ./caddy_config:/config

  #####
  # Laravel
  laravel:
    # the DOCKER_IMAGE_VERSION is replaced with the actual tagged version during deployment by the `sed` command
    image: ghcr.io/sandstorm/serious-game-legacy/laravel:${IMAGE_TAG}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # DB connection
      DB_CONNECTION: mariadb
      DB_HOST: 'mariadb'
      DB_PORT: 3306
      DB_PASSWORD: '${DB_PASSWORD}'
      DB_USERNAME: 'laravel'
      DB_DATABASE: 'laravel'

      APP_ENV: production
      APP_URL: https://legacy-project.sandstorm.dev
      APP_KEY: ${APP_KEY}
      CACHE_STORE: redis
      REDIS_HOST: 'redis'
      REDIS_PORT: 6379
      SHELL_ENV_DISPLAY: 'production-serious-game'

      REVERB_APP_ID: ${REVERB_APP_ID}
      REVERB_APP_KEY: ${REVERB_APP_KEY}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}

      # Profiling (Excimer -> vector), see docs/2026_11_10_Excimer_Profiling.md
      # profiling is only active if PROFILING_VECTOR_URL is set (in .env: PROFILING_VECTOR_URL=http://vector:8234)
      PROFILING_VECTOR_URL: ${PROFILING_VECTOR_URL:-}
      PROFILING_VECTOR_USER: ${VECTOR_AGENT_USERNAME:-}
      PROFILING_VECTOR_PASSWORD: ${VECTOR_AGENT_PASSWORD:-}
      PROFILING_PERIOD: ${PROFILING_PERIOD:-1}

    volumes:
      - ./app_logs/:/app/storage/logs/
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  #####
  # Maria DB
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MARIADB_DATABASE: laravel
      MARIADB_USER: laravel
      MARIADB_PASSWORD: '${DB_PASSWORD}'
      MARIADB_AUTO_UPGRADE: 1
    volumes:
      - ./db:/var/lib/mysql
    command: ['mysqld', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_unicode_ci']
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    restart: unless-stopped

  #####
  # Vector agent: receives the Excimer profiles from laravel and ships them via NATS to the
  # Sandstorm profiling pipeline (ClickHouse / Dashica).
  # only started if COMPOSE_PROFILES=profiling is set in .env
  vector:
    image: timberio/vector:0.48.0-alpine
    restart: unless-stopped
    profiles: [ profiling ]
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
      # the NATS credentials file must be placed here on the server
      - ./secrets:/secrets:ro
    environment:
      CUSTOMER_TENANT: 'Uni-Konstanz'
      CUSTOMER_PROJECT: 'Uni-Konstanz-LeGacy'
      HOST_NAME: legacy-project.sandstorm.dev
      HOST_GROUP: Hetzner
      NATS_TARGET_SERVER_ADDRESS: 'tls://natsv1.cloud.sandstorm.de:32222'
      NATS_TARGET_PROFILING_SUBJECT: profiling.default.customer.${PROFILING_CUSTOMER_TENANT:-}
      NATS_CREDENTIALS_FILE: /secrets/logging_nats_customers.creds
      VECTOR_AGENT_USERNAME: ${VECTOR_AGENT_USERNAME:-}
      VECTOR_AGENT_PASSWORD: ${VECTOR_AGENT_PASSWORD:-}

    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
