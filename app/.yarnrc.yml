nodeLinker: node-modules
# use .yarn/cache folder instead of global cache (https://yarnpkg.com/features/caching)
enableGlobalCache: false

# Block installation of packages published less than 14 days ago to reduce supply chain attack exposure
npmMinimalAgeGate: "14d"

# Exact versions exempt from the age gate because they fix a security advisory.
# Remove an entry once the version is older than the age gate.
npmPreapprovedPackages:
  # undici 6.29.1 fixes GHSA-4qv8-2p9j-2685 and GHSA-xjj6-f33q-929c, published 2026-10-15
  - "undici@6.29.1"
  # postcss-selector-parser 6.1.5 backports the fix for GHSA-rj75-hqrm-r3gf, published 2026-10-19
  - "postcss-selector-parser@6.1.5"

# Advisories that do not affect us. Remove an entry once a patched version is available.
npmAuditIgnoreAdvisories:
  # braces <=3.0.3 stack-exhaustion DoS (GHSA-vfj7-8cjw-p6xm), no patched version exists yet.
  # Only pulled in by tailwindcss 3 for building the Filament admin theme, never shipped,
  # and only processes our own glob patterns. Goes away with the Filament 4 / Tailwind 4 upgrade.
  - "1240992"
